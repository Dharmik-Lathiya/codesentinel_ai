# CodeSentinel AI — Basic Example (Single Project)
#
# SHIPPED: Use the reusable workflow (no copy needed):
#   jobs:
#     review:
#       uses: Dharmik-Lathiya/CodeSentinel_AI/.github/workflows/review.yml@v0.11.0
#       secrets: inherit
#
# CUSTOM: Copy this file to your repo: .github/workflows/ai-review.yml

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip bot PRs, trigger on /review comment
    if: |
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'pull_request' ||
        contains(github.event.comment.body || '', '/review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: Dharmik-Lathiya/CodeSentinel_AI@v0.11.0
        id: ai-review
        with:
          mode: review
          # Uncomment to use OpenAI instead (API keys come from GitHub Secrets):
          # openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
