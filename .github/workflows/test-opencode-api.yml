name: Test OpenCode API Key

on:
  workflow_dispatch:        # Run manually from the Actions tab
  schedule:
    - cron: "0 6 * * *"    # Also runs daily at 06:00 UTC

permissions:
  contents: read
  issues: write             # For creating a failure issue if the key stops working

jobs:
  test-opencode-api:
    name: Ping OpenCode API
    runs-on: ubuntu-latest

    steps:
      # ── 1. Resolve and print the base URL (mirrors opencode.ts logic) ───────
      - name: Resolve base URL
        id: url
        env:
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
        run: |
          RAW="${OPENCODE_BASE_URL:-http://localhost:4096}"

          # Mirror the exact normalization in src/ai/opencode.ts:
          #   .replace(/\/v1$/, "").replace(/\/$/, "")
          BASE=$(echo "$RAW" | sed 's|/v1$||' | sed 's|/$||')

          echo "base_url=$BASE"                      >> "$GITHUB_OUTPUT"
          echo "api_url=$BASE/v1/chat/completions"   >> "$GITHUB_OUTPUT"
          echo "models_url=$BASE/v1/models"          >> "$GITHUB_OUTPUT"

          echo "Raw secret   : $RAW"
          echo "Resolved base: $BASE"
          echo "API endpoint : $BASE/v1/chat/completions"

      # ── 2. Validate key is present ─────────────────────────────────────────
      - name: Validate API key is set
        id: key_check
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::OPENCODE_API_KEY secret is not set!"
            echo "key_set=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "key_set=true" >> "$GITHUB_OUTPUT"
          echo "OPENCODE_API_KEY is set (length=${#OPENCODE_API_KEY})"

      # ── 3. Probe /v1/models to quickly verify auth ─────────────────────────
      - name: Probe /v1/models (auth check)
        id: models
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          MODELS_URL="${{ steps.url.outputs.models_url }}"
          echo "GET $MODELS_URL"

          RESPONSE=$(curl -s -w "\n__STATUS__:%{http_code}" \
            --max-time 15 \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Accept: application/json" \
            "$MODELS_URL")

          STATUS=$(echo "$RESPONSE" | grep "__STATUS__:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE"   | sed '/__STATUS__:/d')

          echo "HTTP $STATUS"
          echo "Body (first 300 chars): ${BODY:0:300}"
          echo "models_status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "200" ]; then
            echo "✅ /v1/models responded 200 — auth looks good"
          else
            echo "::warning::/v1/models returned $STATUS (may not be supported by this endpoint)"
          fi

      # ── 4. Send a minimal chat completion ─────────────────────────────────
      - name: Send test AI completion (PING -> PONG)
        id: ai_test
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          API_URL="${{ steps.url.outputs.api_url }}"
          echo "POST $API_URL"

          RESPONSE=$(curl -s -w "\n__STATUS__:%{http_code}" \
            --max-time 60 \
            -X POST "$API_URL" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "deepseek-v4-flash-free",
              "messages": [
                {"role": "user", "content": "Reply with exactly one word: PONG"}
              ],
              "max_tokens": 20,
              "temperature": 0
            }')

          STATUS=$(echo "$RESPONSE" | grep "__STATUS__:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE"   | sed '/__STATUS__:/d')

          echo "HTTP status : $STATUS"
          echo "Response    : ${BODY:0:500}"

          echo "http_status=$STATUS" >> "$GITHUB_OUTPUT"

          # Parse AI reply
          RESULT=$(echo "$BODY" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    choices = d.get('choices', [])
    if choices:
        msg = choices[0].get('message', {})
        content = msg.get('content') or msg.get('reasoning_content') or ''
        if content.strip():
            print('ok:' + content.strip()[:200])
        else:
            print('empty:no content in message object')
    else:
        err = d.get('error', {})
        print('error:' + str(err.get('message', d)))
except Exception as e:
    print('parse_error:' + str(e))
" 2>/dev/null || echo "parse_error:python3 unavailable")

          KIND="${RESULT%%:*}"
          VALUE="${RESULT#*:}"

          if [ "$KIND" = "ok" ]; then
            echo "has_content=true"   >> "$GITHUB_OUTPUT"
            echo "ai_reply=$VALUE"    >> "$GITHUB_OUTPUT"
            echo "result_kind=ok"     >> "$GITHUB_OUTPUT"
            echo "✅ AI replied: $VALUE"
          else
            echo "has_content=false"  >> "$GITHUB_OUTPUT"
            echo "ai_reply="          >> "$GITHUB_OUTPUT"
            echo "result_kind=$KIND"  >> "$GITHUB_OUTPUT"
            echo "::error::AI did not return content. HTTP=$STATUS kind=$KIND detail=$VALUE"
            echo ""
            echo "=== Troubleshooting ==="
            echo "OPENCODE_BASE_URL must be the API host — NOT the website."
            echo "  OK : https://api.opencode.ai  (or your self-hosted address)"
            echo "  BAD: https://opencode.ai/zen  (that is the marketing website)"
            echo "Check Settings > Secrets > Actions and correct OPENCODE_BASE_URL."
            exit 1
          fi

      # ── 5. Print summary to console ────────────────────────────────────────
      - name: Print result summary
        if: always()
        run: |
          echo "================================================"
          echo "  OpenCode API Key Health Check"
          echo "================================================"
          echo "  Resolved API URL  : ${{ steps.url.outputs.api_url }}"
          echo "  API key set       : ${{ steps.key_check.outputs.key_set }}"
          echo "  /v1/models status : ${{ steps.models.outputs.models_status }}"
          echo "  Chat HTTP status  : ${{ steps.ai_test.outputs.http_status }}"
          echo "  AI replied        : ${{ steps.ai_test.outputs.has_content }}"
          echo "  AI reply content  : ${{ steps.ai_test.outputs.ai_reply }}"
          echo "================================================"

      # ── 6. GitHub Step Summary table ───────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          {
            echo "# OpenCode API Key Test"
            echo ""
            if [ "${{ steps.ai_test.outputs.has_content }}" = "true" ]; then
              echo "## ✅ PASS"
            else
              echo "## ❌ FAIL"
            fi
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Resolved API URL | \`${{ steps.url.outputs.api_url }}\` |"
            if [ "${{ steps.key_check.outputs.key_set }}" = "true" ]; then
              echo "| API key configured | ✅ Yes |"
            else
              echo "| API key configured | ❌ Missing |"
            fi
            echo "| /v1/models status | \`${{ steps.models.outputs.models_status }}\` |"
            echo "| Chat HTTP status | \`${{ steps.ai_test.outputs.http_status }}\` |"
            if [ "${{ steps.ai_test.outputs.has_content }}" = "true" ]; then
              echo "| AI returned content | ✅ Yes |"
            else
              echo "| AI returned content | ❌ No |"
            fi
            echo "| AI reply | \`${{ steps.ai_test.outputs.ai_reply }}\` |"
            echo ""
            echo "> Model tested: \`deepseek-v4-flash-free\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 7. Open issue on daily failure ────────────────────────────────────
      - name: Open issue on failure (scheduled runs only)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 OpenCode API key health check failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## OpenCode API Key is not working',
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '**Possible causes:**',
              '- `OPENCODE_API_KEY` secret has expired or been revoked',
              '- `OPENCODE_BASE_URL` is wrong — must be the **API host**, not the website',
              '  - ✅ Correct: `https://api.opencode.ai` (or your self-hosted URL)',
              '  - ❌ Wrong:   `https://opencode.ai/zen` (marketing site, serves HTML)',
              '- API quota exhausted',
              '',
              'Check **Settings → Secrets and variables → Actions** and verify both secrets.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'opencode-api-failure',
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                labels: ['opencode-api-failure', 'bug'],
              });
            }
