name: "CodeSentinel AutoFix (reusable)"

on:
  workflow_call:
    inputs:
      version:
        description: "CodeSentinel action tag to use (e.g. v0.11.0). Pinned to a release, never a branch."
        required: false
        type: string
        default: "v0.11.0"
      max_iterations:
        description: "Max fix iterations"
        required: false
        type: string
        default: "5"
      provider:
        description: "AI provider: opencode | openai | anthropic | gemini (overrides all task models)"
        required: false
        type: string
        default: "opencode"
      run_checks_after_fix:
        description: "Commands to run after fix (e.g. npm run lint)"
        required: false
        type: string
        default: "npm run lint && npm run typecheck"
      enable_auto_merge:
        description: "Auto-merge the PR after a successful fix (true/false)"
        required: false
        type: string
        default: "false"
    secrets:
      CODESENTINEL_GITHUB_TOKEN:
        description: "Optional PAT for git push (overrides GITHUB_TOKEN)"
        required: false
      GITHUB_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENCODE_API_KEY:
        required: false
      OPENCODE_BASE_URL:
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.CODESENTINEL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Export PR number for comment posting
        id: prnum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            echo "GITHUB_PR_NUMBER=$PR" >> "$GITHUB_ENV"
          else
            echo "No PR number in event context — comments will be skipped"
          fi

      - name: Run CodeSentinel fix
        id: cs
        uses: Dharmik-Lathiya/CodeSentinel_AI@${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.CODESENTINEL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
        with:
          mode: fix
          max_iterations: ${{ inputs.max_iterations }}
          provider: ${{ inputs.provider }}

      - name: Run checks after fix
        if: inputs.run_checks_after_fix != ''
        run: ${{ inputs.run_checks_after_fix }}

      - name: Commit and push fixes
        env:
          GIT_PUSH_TOKEN: ${{ secrets.CODESENTINEL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "${CODESENTINEL_GIT_NAME:-Dharmik Lathiya}"
          git config user.email "${CODESENTINEL_GIT_EMAIL:-dharmiklathiya.it@gmail.com}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by fix"
          else
            git commit -m "fix: CodeSentinel auto-fix [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi

      - name: Auto-merge when gate passes
        if: inputs.enable_auto_merge == 'true' && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.CODESENTINEL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto
