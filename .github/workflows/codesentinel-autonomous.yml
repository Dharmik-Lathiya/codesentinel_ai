name: CodeSentinel Autonomous Improvement

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "22"

jobs:
  auto-improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & Build
        run: npm ci && npm run build

      - name: Install OpenCode CLI
        run: |
          npm install -g opencode-ai
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
          opencode --version

      - name: Auto-Fix Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          git config user.name "${CODESENTINEL_GIT_NAME:-Dharmik Lathiya}"
          git config user.email "${CODESENTINEL_GIT_EMAIL:-dharmiklathiya.it@gmail.com}"
          node dist/index.js fix --auto-fix --use-opencode-cli 2>&1 || true
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "CodeSentinel: auto-fix issues [skip ci]"
            git pull --rebase origin main 2>/dev/null || true
            git push
          else
            echo "No changes from auto-fix"
          fi

      - name: Generate Feature
        id: feature-gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          DAY_OF_YEAR=$(date +%j)
          HOUR=$(date +%H)
          MINUTE=$(date +%M)
          TYPE_INDEX=$(( (10#$DAY_OF_YEAR + 10#$HOUR + 10#$MINUTE / 30) % 3 ))
          case $TYPE_INDEX in
            0) TYPE="test" ;;
            1) TYPE="util" ;;
            2) TYPE="doc" ;;
          esac
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          node dist/index.js testgen --use-opencode-cli 2>&1 || true
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Create Feature PR
        if: ${{ steps.feature-gen.outputs.generated == 'true' }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            TIMESTAMP=$(date +%Y%m%d%H%M)
            BRANCH="codesentinel/improve/${TIMESTAMP}"
            TYPE="${{ steps.feature-gen.outputs.type }}"
            git config user.name "${CODESENTINEL_GIT_NAME:-Dharmik Lathiya}"
            git config user.email "${CODESENTINEL_GIT_EMAIL:-dharmiklathiya.it@gmail.com}"
            git checkout -b "${BRANCH}"
            git add -A
            git commit -m "CodeSentinel: ${TYPE} improvement [skip ci]"
            git push origin "${BRANCH}"
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "CodeSentinel: ${TYPE} improvement - ${TIMESTAMP}" \
              --body "Automated ${TYPE} improvement generated by CodeSentinel autonomous scheduler."
          else
            echo "No changes from feature generation"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
