name: CodeSentinel AI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: false
        default: "review"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  codesentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: npm ci && npm run build

      - name: Install OpenCode CLI
        run: |
          npm install -g opencode-ai
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
          opencode --version

      - name: Run CodeSentinel
        uses: ./
        with:
          mode: ${{ github.event.inputs.mode || 'review' }}
          enable_scoring: "true"
          enable_auto_fix: "false"
          use_opencode_cli: "true"
          provider: "opencode"
