name: "CodeSentinel AI"
description: "AI-powered code review, fix, audit, scoring, and test generation."
author: "CodeSentinel"
branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "Operation mode: review | fix | audit | score | testgen | chat"
    required: false
    default: "review"
  max_iterations:
    description: "Max fix iterations"
    required: false
    default: "5"
  enable_auto_fix:
    description: "Apply fixes automatically (true/false)"
    required: false
    default: "false"
  enable_scoring:
    description: "Compute code quality score (true/false)"
    required: false
    default: "true"
  enable_test_generation:
    description: "Generate missing tests (true/false)"
    required: false
    default: "false"
  test_runner:
    description: "jest or vitest"
    required: false
    default: "vitest"
  project_context:
    description: "Free-form context injected into prompts"
    required: false
    default: ""
  provider:
    description: "AI provider: opencode | openai | anthropic | gemini (overrides all task models)"
    required: false
    default: "opencode"
  config_path:
    description: "Path to a codesentinel config file"
    required: false
    default: ""
  openai_api_key:
    description: "OpenAI API key"
    required: false
  anthropic_api_key:
    description: "Anthropic API key"
    required: false
  gemini_api_key:
    description: "Gemini API key"
    required: false
  opencode_base_url:
    description: "OpenCode base URL"
    required: false
    default: ""
  auto_merge:
    description: "Auto-merge PRs when quality gates pass (true/false)"
    required: false
    default: "false"
  opencode_api_key:
    description: "OpenCode API key"
    required: false
  issue_title:
    description: "Issue title (for plan mode)"
    required: false
  issue_body:
    description: "Issue body (for plan mode)"
    required: false
  ask:
    description: "Question to ask (chat mode)"
    required: false

outputs:
  score:
    description: "Overall quality score (0-100) when scoring is enabled"
  findings:
    description: "Number of findings detected"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: npm ci --prefix "${{ github.action_path }}" --omit=dev --ignore-scripts --no-audit --no-fund
    - name: Run CodeSentinel
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MAX_ITERATIONS: ${{ inputs.max_iterations }}
        INPUT_ENABLE_AUTO_FIX: ${{ inputs.enable_auto_fix }}
        INPUT_ENABLE_SCORING: ${{ inputs.enable_scoring }}
        INPUT_ENABLE_TEST_GENERATION: ${{ inputs.enable_test_generation }}
        INPUT_TEST_RUNNER: ${{ inputs.test_runner }}
        INPUT_PROJECT_CONTEXT: ${{ inputs.project_context }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        INPUT_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        INPUT_OPENCODE_BASE_URL: ${{ inputs.opencode_base_url }}
        INPUT_AUTO_MERGE: ${{ inputs.auto_merge }}
        INPUT_OPENCODE_API_KEY: ${{ inputs.opencode_api_key }}
        INPUT_ISSUE_TITLE: ${{ inputs.issue_title }}
        INPUT_ISSUE_BODY: ${{ inputs.issue_body }}
        INPUT_ASK: ${{ inputs.ask }}
      run: node "${{ github.action_path }}/dist/github/action.js" 2>&1 | tee /tmp/cs-out.txt
