name: "CodeSentinel AI"
description: "AI-powered code review, fix, audit, scoring, and test generation."
author: "CodeSentinel"
branding:
  icon: "shield"
  color: "blue"

inputs:
  mode:
    description: "Operation mode: review | fix | audit | score | testgen | chat | plan | describe"
    required: false
    default: "review"
  max_iterations:
    description: "Max fix iterations"
    required: false
    default: "5"
  enable_auto_fix:
    description: "Apply fixes automatically (true/false)"
    required: false
    default: "false"
  enable_scoring:
    description: "Compute code quality score (true/false)"
    required: false
    default: "true"
  enable_test_generation:
    description: "Generate missing tests (true/false)"
    required: false
    default: "false"
  test_runner:
    description: "jest or vitest"
    required: false
    default: "vitest"
  project_context:
    description: "Free-form context injected into prompts"
    required: false
    default: ""
  provider:
    description: "AI provider: opencode | openai | anthropic | gemini (overrides all task models)"
    required: false
    default: "opencode"
  opencode_version:
    description: "OpenCode CLI version to install (e.g. v0.3.0 or latest)"
    required: false
    default: "latest"
  use_opencode_cli:
    description: "Use the local OpenCode CLI binary instead of the AI provider API (true/false)"
    required: false
    default: "false"
  config_path:
    description: "Path to a codesentinel config file"
    required: false
    default: ""
  openai_api_key:
    description: "OpenAI API key"
    required: false
  anthropic_api_key:
    description: "Anthropic API key"
    required: false
  gemini_api_key:
    description: "Gemini API key"
    required: false
  opencode_base_url:
    description: "OpenCode base URL"
    required: false
    default: ""
  auto_merge:
    description: "Auto-merge PRs when quality gates pass (true/false)"
    required: false
    default: "false"
  opencode_api_key:
    description: "OpenCode API key"
    required: false
  issue_title:
    description: "Issue title (for plan mode)"
    required: false
  issue_body:
    description: "Issue body (for plan mode)"
    required: false
  ask:
    description: "Question to ask (chat mode)"
    required: false
  audit_create_issues:
    description: "Create GitHub issues for audit findings (true/false)"
    required: false
    default: "true"
  audit_auto_fix:
    description: "Add the autofix-trigger label so the fix loop picks up audit issues (true/false)"
    required: false
    default: "false"
  audit_labels:
    description: "Comma-separated labels for audit issues"
    required: false
    default: "audit"
  audit_target_dirs:
    description: "Comma-separated directories to audit (empty = whole repo)"
    required: false
    default: ""

outputs:
  score:
    description: "Overall quality score (0-100) when scoring is enabled"
  findings:
    description: "Number of findings detected"

runs:
  using: "node20"
  main: "dist/action-bundle/index.mjs"